name: Deploy to Graph Loot Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GraphLootWASM
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore GraphLootWASM.sln

    - name: Publish
      run: dotnet publish GraphLootWASM.sln -c Release -o dist

    - name: Checkout Graph Loot Engine
      uses: actions/checkout@v4
      with:
        repository: garrettbovo/GraphLoot-Engine
        token: ${{ secrets.DEPLOY_TOKEN }}
        path: engine-repo

    - name: Copy build to Graph Loot Engine
      run: |
        rm -rf engine-repo/graph-loot-wasm
        cp -r dist/wwwroot engine-repo/graph-loot-wasm

    - name: Commit and push changes
      working-directory: engine-repo
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add graph-loot-wasm
        git commit -m "Update WASM build from GraphLootWASM" || echo "No changes to commit"
        git push
