name: Deploy to Graph Loot Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GraphLootWASM
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore GraphLootWASM.sln

    - name: Publish
      run: dotnet publish GraphLootWASM.sln -c Release -o dist

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasm-build
        path: dist/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: wasm-build
        path: build

    - name: Deploy to Graph Loot Engine gh-pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        personal_token: ${{ secrets.DEPLOY_TOKEN }}
        external_repository: garrettbovo/GraphLoot-Engine
        publish_branch: gh-pages
        publish_dir: ./build
